[package]
name = "disylab"
version = "2.0.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-http = { version = "=2.5.9", default-features = false, features = ["rustls-tls", "unsafe-headers"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
